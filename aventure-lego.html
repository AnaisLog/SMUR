<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon aventure</title>
<style>
:root{--bg:#eef3f1;--card:#fbfdfc;--ink:#2f3e3a;--soft:#6b7f79;--line:#d5e0dc;--accent:#7fb8a4;--accent2:#f3c9a5;--ok:#9ccfb6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2927;--card:#283532;--ink:#e6efec;--soft:#9db3ac;--line:#3b4c48;--accent:#6aa893;--accent2:#c99a76;--ok:#5f9e86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2927;--card:#283532;--ink:#e6efec;--soft:#9db3ac;--line:#3b4c48;--accent:#6aa893;--accent2:#c99a76;--ok:#5f9e86;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:8px 0 4px}
#hero{width:170px;height:170px;object-fit:contain}
#hero.hop{animation:hop .8s}
@keyframes hop{30%{transform:translateY(-22px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
h1{font-size:1.25rem;margin:8px 0 2px}
.stage{color:var(--soft);margin:0 0 10px;min-height:3em}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .9s ease}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--soft);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.card h2{font-size:1.05rem;margin:0 0 6px}
.act{display:flex;align-items:center;gap:12px;padding:10px 4px;cursor:pointer;min-height:48px;border-radius:12px}
.act input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.act.done span{color:var(--soft);text-decoration:line-through}
.empty{color:var(--soft);font-size:.9rem}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer;min-height:48px}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.big{width:100%;font-size:1.1rem;background:var(--accent2);color:#3a2b1e}
.row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
.row input[type=text],.row input[type=password]{flex:1;min-width:0;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap;font-size:1.5rem}
.map{position:relative;margin:10px 0 0;padding-top:10px}
.map svg{width:100%;height:auto;display:block}
#pin{position:absolute;width:42px;height:42px;object-fit:contain;transform:translate(-50%,-95%);transition:left .9s ease,top .9s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));pointer-events:none}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:1.8rem;padding:8px 0;background:transparent;border:2px solid transparent;border-radius:14px}
.moods button.on{border-color:var(--accent);background:var(--bg)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:340px;width:100%}
.toast{text-align:center;color:var(--soft);min-height:1.5em;font-size:.95rem}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:30;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.conf,#hero.hop{animation:none}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <!-- ▼ ZONE IMAGE : remplace avec ton personnage LEGO (bouton ci-dessous) ou mets une URL/data: dans src -->
    <img id="hero" alt="Mon personnage LEGO" src="">
    <h1 id="stageName"></h1>
    <p class="stage" id="stageText"></p>
    <div class="map"><svg id="svg" viewBox="0 0 340 300" role="img" aria-label="Carte de l’itinéraire"></svg><img id="pin" alt=""></div>
    <div class="meta"><span id="lvl"></span><span id="today"></span></div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="card"><h2>Mon humeur du jour</h2><div class="moods" id="moods"></div></div>
  <div id="pillars"></div>

  <button class="big hidden" id="askBtn">Demander la validation ✨</button>
  <div class="card hidden" id="doneCard">Journée validée. Bravo, ton personnage avance ! 🎉</div>

  <div class="card"><h2>Mes badges</h2><div class="badges" id="badges"><span class="empty">Ton premier badge t’attend.</span></div></div>

  <button class="sec" id="cfgBtn">⚙️ Configuration</button>
  <div class="card hidden" id="cfg">
    <h2>Configuration</h2>
    <div id="cfgPillars"></div>
    <div class="row"><label for="code">Code du tiers :</label><input id="code" type="text" inputmode="numeric" maxlength="8"></div>
    <div class="row"><label class="sec" style="padding:12px 18px;border:1px solid var(--line);border-radius:14px;cursor:pointer">🧱 Choisir mon image LEGO<input id="file" type="file" accept="image/*" hidden></label></div>
    <h2 style="margin-top:14px">Outils de test</h2>
    <div class="row">
      <button class="sec" id="simBtn">Simuler 1 jour sans action</button>
      <button class="sec" id="resetBtn">Tout réinitialiser</button>
    </div>
  </div>
</main>

<div class="modal hidden" id="modal">
  <div class="card">
    <h2>Validation par un proche</h2>
    <p class="empty">Un parent, un conjoint ou un ami entre le code pour valider la journée.</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="Code" autocomplete="off"></div>
    <div class="toast" id="pinMsg"></div>
    <div class="row"><button id="pinOk">Valider</button><button class="sec" id="pinNo">Plus tard</button></div>
  </div>
</div>

const KEY="aventure-tdah-v1";
let S;
const today=()=>new Date().toDateString();
const $=id=>document.getElementById(id);

function fresh(){return{actions:DEFAULTS.map(a=>[...a]),checks:{},level:0,last:Date.now(),day:today(),validated:false,code:"1234",badges:[],hero:"",moods:{}}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}S.moods=S.moods||{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){$("toast").textContent=t;if(t)setTimeout(()=>{if($("toast").textContent===t)$("toast").textContent=""},5000)}

function newDay(){
  if(S.day!==today()){S.day=today();S.checks={};S.validated=false}
}
function inactivity(){
  let moved=false,guard=0;
  while(Date.now()-S.last>=DAY&&guard++<50){
    if(S.level>0){S.level--;S.last+=DAY;moved=true}else{S.last=Date.now();break}
  }
  if(moved)toast("Ton personnage est revenu à l’étape « "+STAGES[S.level][0]+" ». On repart quand tu veux.");
  return moved;
}
function totals(){
  let t=0,d=0;
  S.actions.forEach((l,p)=>l.forEach((_,i)=>{t++;if(S.checks[p+"-"+i])d++}));
  return[t,d];
}

function render(){
  const [t,d]=totals();
  $("hero").src=S.hero||PLACEHOLDER;
  $("stageName").textContent=STAGES[S.level][0];
  $("stageText").textContent=STAGES[S.level][1];
  drawMap();drawMood();
  $("lvl").textContent="Étape "+(S.level+1)+" / "+STAGES.length;
  $("today").textContent=d+" / "+t+" aujourd’hui";
  const box=$("pillars");box.innerHTML="";
  PILLARS.forEach(([ic,name],p)=>{
    const c=document.createElement("div");c.className="card";
    const h=document.createElement("h2");h.textContent=ic+" "+name;c.appendChild(h);
    if(!S.actions[p].length){const e=document.createElement("div");e.className="empty";e.textContent="Aucune action. Ajoute-en dans la configuration.";c.appendChild(e)}
    S.actions[p].forEach((txt,i)=>{
      const id=p+"-"+i,l=document.createElement("label");
      l.className="act"+(S.checks[id]?" done":"");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!S.checks[id];cb.disabled=S.validated;
      cb.onchange=()=>toggle(id,cb.checked);
      const sp=document.createElement("span");sp.textContent=txt;
      l.append(cb,sp);c.appendChild(l);
    });
    box.appendChild(c);
  });
  $("askBtn").classList.toggle("hidden",!(t>0&&d===t&&!S.validated));
  $("doneCard").classList.toggle("hidden",!S.validated);
  const b=$("badges");
  if(S.badges.length){b.innerHTML="";S.badges.forEach(x=>{const s=document.createElement("span");s.textContent=x;s.title="Badge";b.appendChild(s)})}
  $("code").value=S.code;
  renderCfg();
}

function toggle(id,v){
  if(v){S.checks[id]=true;S.last=Date.now();
    const [t,d]=totals();toast(d===t?"Tout est fait ! Un proche peut valider.":"Super, une de plus ✔")}
  else delete S.checks[id];
  save();render();
}

function renderCfg(){
  const box=$("cfgPillars");box.innerHTML="";
  PILLARS.forEach(([ic,name],p)=>{
    const w=document.createElement("div");w.style.marginBottom="12px";
    const h=document.createElement("strong");h.textContent=ic+" "+name+" ("+S.actions[p].length+"/5)";w.appendChild(h);
    S.actions[p].forEach((txt,i)=>{
      const r=document.createElement("div");r.className="row";
      const inp=document.createElement("input");inp.type="text";inp.value=txt;inp.maxLength=60;
      inp.onchange=()=>{S.actions[p][i]=inp.value.trim()||txt;S.checks={};save();render()};
      const del=document.createElement("button");del.className="sec";del.textContent="✕";del.setAttribute("aria-label","Supprimer");
      del.disabled=S.actions[p].length<=1;
      del.onclick=()=>{S.actions[p].splice(i,1);S.checks={};save();render()};
      r.append(inp,del);w.appendChild(r);
    });
    if(S.actions[p].length<5){
      const add=document.createElement("button");add.className="sec";add.textContent="+ Ajouter une action";
      add.onclick=()=>{S.actions[p].push("Nouvelle action");S.checks={};save();render()};
      w.appendChild(add);
    }
    box.appendChild(w);
  });
}

const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const MOODS=[["😞","Difficile"],["😕","Bof"],["😐","Neutre"],["🙂","Bien"],["😄","Super"]];
const ICONS=["🚩","🚑","🎒","🩺","🫀","🫁","🧠","🏥","🦴","💉","⚡","📚","📈","🚁","🏛️","🪑","🚪"];
const PTS=[[30,270],[95,270],[160,270],[225,270],[290,270],[290,200],[225,200],[160,200],[95,200],[30,200],[30,130],[95,130],[160,130],[225,130],[290,130],[290,60],[225,60]];
function drawMood(){
  const box=$("moods");box.innerHTML="";const cur=S.moods[dk(new Date())];
  MOODS.forEach(([e,l],i)=>{
    const b=document.createElement("button");b.textContent=e;b.title=l;b.setAttribute("aria-label",l);
    if(cur===i+1)b.className="on";
    b.onclick=()=>{S.moods[dk(new Date())]=i+1;save();drawMood();toast("Noté, merci. Prends soin de toi 💛")};
    box.appendChild(b);
  });
}
function drawMap(){
  const j=a=>a.map(p=>p.join(",")).join(" ");
  const st='fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
  let g='<polyline points="'+j(PTS)+'" '+st+' stroke="var(--line)" stroke-dasharray="1 9"/>';
  g+='<polyline points="'+j(PTS.slice(0,S.level+1))+'" '+st+' stroke="var(--accent)"/>';
  PTS.forEach((p,i)=>{
    const on=i<=S.level;
    g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" fill="var(--card)" stroke="'+(on?"var(--accent)":"var(--line)")+'" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+6)+'" font-size="16" text-anchor="middle" opacity="'+(on?1:.4)+'">'+ICONS[i]+'</text>';
  });
  $("svg").innerHTML=g;
  const c=PTS[S.level],pin=$("pin");
  pin.src=S.hero||PLACEHOLDER;pin.style.left=(c[0]/340*100)+"%";pin.style.top=(c[1]/300*100)+"%";
}
function confetti(){
  const cols=["#f3c9a5","#7fb8a4","#f6d36b","#9bb7e0","#e6a6b8"];
  for(let i=0;i<50;i++){
    const e=document.createElement("div");e.className="conf";
    e.style.left=Math.random()*100+"vw";e.style.background=cols[i%5];
    e.style.animationDelay=Math.random()*.6+"s";e.style.borderRadius=i%2?"50%":"2px";
    document.body.appendChild(e);setTimeout(()=>e.remove(),3500);
  }
}
const BADGES=["⭐","🌟","🏅","🎖️","🧱","🏆","💎","🚀","🌈","👑"];
function validate(){
  S.validated=true;S.last=Date.now();
  const up=S.level<MAX;
  if(up)S.level++;
  S.badges.push(BADGES[(S.badges.length)%BADGES.length]);
  save();render();confetti();
  const h=$("hero");h.classList.remove("hop");void h.offsetWidth;h.classList.add("hop");
  toast(up?"Bravo ! Nouvelle étape : « "+STAGES[S.level][0]+" » 🎉":"Bravo, tu gardes le sommet ! 🏆");
}

$("askBtn").onclick=()=>{$("pin").value="";$("pinMsg").textContent="";$("modal").classList.remove("hidden");$("pin").focus()};
$("pinNo").onclick=()=>$("modal").classList.add("hidden");
$("pinOk").onclick=()=>{
  if($("pin").value===S.code){$("modal").classList.add("hidden");validate()}
  else $("pinMsg").textContent="Ce n’est pas le bon code, essaie encore.";
};
$("pin").onkeydown=e=>{if(e.key==="Enter")$("pinOk").click()};
$("cfgBtn").onclick=()=>$("cfg").classList.toggle("hidden");
$("code").onchange=()=>{S.code=$("code").value.trim()||"1234";save()};
$("simBtn").onclick=()=>{S.last-=DAY;const m=inactivity();save();render();if(!m)toast("Déjà à la première étape : rien à ajuster.")};
$("resetBtn").onclick=()=>{const h=S.hero,m=S.moods;S=fresh();S.hero=h;S.moods=m;save();render()};
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const c=document.createElement("canvas"),k=Math.min(1,400/Math.max(img.width,img.height));
    c.width=img.width*k;c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.hero=c.toDataURL("image/png");URL.revokeObjectURL(u);save();render();
  };
  img.src=u;
};

load();newDay();inactivity();save();render();
setInterval(()=>{newDay();if(inactivity()){save();render()}},60000);
</script>
</body>
</html>
